name: Auto Book Tennis Court

on:
  schedule:
    # Run every 10 minutes from 00:00 UTC to 11:00 UTC (07:00 AM to 18:00 PM WIB / GMT+7)
    - cron: '*/10 0-11 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  check-and-book:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Run Court Auto-Booking Bot
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://xdrsowoekbqalkonezcw.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_5486NL5JTIMKrmB-hxNv_Q_eF1bx5qa' }}
        run: |
          node scripts/auto_book_court.cjs
